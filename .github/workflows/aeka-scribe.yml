name: Aeka Scribe

on:
  push:
    paths: ['aeka-scribe/**', '.github/workflows/aeka-scribe.yml']
  pull_request:
    paths: ['aeka-scribe/**', '.github/workflows/aeka-scribe.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: aeka-scribe

jobs:
  checks:
    name: Web and shared checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm format:check
      - run: pnpm lint
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm test
      - run: npm --prefix desktop run build:ui
      - run: npm --prefix desktop test
      - run: pnpm build

  windows:
    name: Windows desktop (tests, smoke launch, package)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix desktop ci
      - name: Desktop unit tests, including the real PowerShell helper
        run: npm --prefix desktop test
      - run: npm --prefix desktop run build:ui
      - name: Smoke launch (starts, opens the vault and window, then quits)
        shell: pwsh
        run: |
          $env:AEKA_SCRIBE_SMOKE_TEST = '1'
          $p = Start-Process -FilePath "desktop\node_modules\electron\dist\electron.exe" -ArgumentList "desktop" -PassThru -NoNewWindow -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Aeka Scribe did not finish its smoke launch within 120 s.' }
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) { throw "Smoke launch failed with exit code $($p.ExitCode)." }
          if (-not (Select-String -Path smoke.out -Pattern 'AEKA_SCRIBE_SMOKE_OK' -Quiet)) { throw 'Smoke marker missing.' }
      - name: Package unsigned ZIP and NSIS installer
        run: npm --prefix desktop run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: aeka-scribe-windows-unsigned
          path: |
            aeka-scribe/desktop/release/*.zip
            aeka-scribe/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
